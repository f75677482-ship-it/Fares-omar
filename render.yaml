services:
  - type: web
    name: fares-telegram-bot
    runtime: node
    plan: free
    buildCommand: "npm install --omit=dev --legacy-peer-deps --no-audit --no-fund"
    startCommand: "node index.js"
    healthCheckPath: "/health"
    envVars:
      - key: PORT
        sync: false
      - key: ORCHESTRATOR_PORT
        sync: false
      - key: COMPANION_PORT
        value: 3100
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_DEVELOPER_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ENABLE_TELEGRAM_PAIR_BOT
        value: "false"
